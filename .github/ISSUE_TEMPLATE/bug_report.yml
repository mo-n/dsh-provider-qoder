name: "🐛 Bug Report"
description: "File a bug report to help us improve"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us investigate and resolve it.

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When doing ..., I encountered ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Detailed steps to reproduce the behavior."
      placeholder: |
        1. Start ...
        2. Configure ...
        3. Call ...
        4. Error occurs ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "The operating system where the issue occurred"
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: "DSH Version"
      description: "The version of DSH you are using (and extension version if known)"
      placeholder: "e.g., v1.0.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs / Stack Trace"
      description: "Please paste any relevant error output or stack traces."
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched existing issues and verified this is not a duplicate"
          required: true
