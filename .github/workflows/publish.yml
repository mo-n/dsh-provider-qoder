name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate release version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Tag must match package.json version: v${version}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${version.includes('-') ? 'next' : 'latest'}\n`)
          NODE

      - name: Install package managers
        run: npm install --global pnpm@11.7.0 npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and check package contents
        run: pnpm run check

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const { body } = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'release-notes.json'), 'utf8'))
          // Preserve PR titles and links for the release issue processing step.
          const notes = body.replace(/^([*-] .+) by @\S+ in (https:\/\/github\.com\/[^\s/]+\/[^\s/]+\/pull\/\d+)[ \t]*$/gm, '$1 in $2')
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), notes)
          NODE

      # Verification already ran above; avoid repeating prepublishOnly.
      - name: Publish with npm trusted publishing
        run: npm publish --ignore-scripts --access public --provenance --registry https://registry.npmjs.org --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: |
          pnpm pack
          RELEASE_ARGS=("$GITHUB_REF_NAME" *.tgz --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$DIST_TAG" = "next" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"

      - name: Close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-issues.ts close
